[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-zeus"
version = "0.1.0"
description = "Forge (Zeus): A multi-LLM LangGraph pipeline with epsilon-greedy bandit routing that turns one sentence into a tested, staged web app."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "litellm>=1.40.0",
    "langgraph>=0.2.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "docker>=7.0.0",
    "httpx>=0.27.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
forge = "forge.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
